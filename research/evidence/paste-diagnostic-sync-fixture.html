<!doctype html><html lang="ru"><meta charset="utf-8"><title>LayoutPilot isolated input LP-CODEX-001</title><style>body{font:18px system-ui;max-width:800px;margin:45px auto}textarea,[contenteditable]{display:block;width:100%;min-height:110px;border:2px solid #617499;padding:12px;margin:16px 0;white-space:pre-wrap}pre{font-size:12px;white-space:pre-wrap}</style><h1>LayoutPilot — отдельный тест ввода</h1><p>Локальная страница. Отправки сообщений и сетевых запросов нет.</p><label>Обычное поле<textarea id="plain" aria-label="LP-CODEX-001 plain"></textarea></label><label>Редактор содержимого<div id="rich" role="textbox" contenteditable="true" aria-label="LP-CODEX-001 rich"></div></label><output id="format" aria-label="LP-CODEX-001 format"></output><output id="delivery" aria-label="LP-CODEX-001 delivery"></output><pre id="log"></pre><script>window.testEvents=[];let vDown=0,pastes=0,inputs=0,clipMatch=false,cancelled=false,beforeCancelled=false,active=false,pasteAt=0,beforeAt=0,inputAt=0,textInputs=0,textMatch=false,textCancelled=false,beforeMatch=false,lastV="none";function delivery(){document.getElementById("delivery").textContent=`LP-CODEX-001 delivery: V=${vDown}, paste=${pastes}, input=${inputs}, clipMatch=${clipMatch}, cancelled=${cancelled}, beforeCancelled=${beforeCancelled}, active=${active}, timing=${[pasteAt,beforeAt,inputAt].map(Math.round)}, textInput=${textInputs}/${textMatch}/${textCancelled}, beforeMatch=${beforeMatch}, last=${lastV}`};for(const el of [plain,rich]){el.addEventListener("textInput",e=>{textInputs++;textMatch=e.data==="первая\nвторая\tстрока";queueMicrotask(()=>{textCancelled=e.defaultPrevented;delivery()})});el.addEventListener("beforeinput",e=>{beforeMatch=e.dataTransfer?.getData("text/plain")==="первая\nвторая\tстрока";beforeAt=performance.now();queueMicrotask(()=>{beforeCancelled=e.defaultPrevented;delivery()})});el.addEventListener("input",()=>{inputs++;inputAt=performance.now();delivery()});el.addEventListener("paste",e=>{pastes++;pasteAt=performance.now();clipMatch=e.clipboardData?.getData("text/plain")==="первая\nвторая\tстрока";queueMicrotask(()=>{cancelled=e.defaultPrevented;active=document.activeElement===el;delivery()});delivery()});el.addEventListener("keydown",e=>{if(e.code==="KeyV"){vDown++;lastV=JSON.stringify({key:e.key,meta:e.metaKey,alt:e.altKey,shift:e.shiftKey,ctrl:e.ctrlKey,trusted:e.isTrusted});delivery()}})}delivery();for(const el of [plain,rich])for(const type of ['beforeinput','input','keydown','keyup'])el.addEventListener(type,e=>{testEvents.push({field:el.id,type,inputType:e.inputType||null,data:e.data||null,key:e.key||null,value:el.value??el.innerText});log.textContent=testEvents.slice(-12).map(x=>x.type+":"+(x.key||x.inputType||"-")).join(" | ");format.textContent="LP-CODEX-001 rich formatting: "+(rich.querySelector("b,strong,i,em,font,[style]")?"present":"absent")});</script></html>
