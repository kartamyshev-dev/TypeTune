[package]
name = "typetune-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "typetune"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
typetune-core = { path = "../typetune-core" }
typetune-corrector = { path = "../typetune-corrector" }
typetune-chatter = { path = "../typetune-chatter" }
typetune-snippets = { path = "../typetune-snippets" }
typetune-config = { path = "../typetune-config" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shellexpand = "3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
typetune-session = { path = "../typetune-session" }
typetune-input = { path = "../typetune-input" }
typetune-inject = { path = "../typetune-inject" }
typetune-layout = { path = "../typetune-layout" }
typetune-tray = { path = "../typetune-tray" }
signal-hook = "0.3"
libc = "0.2"
zbus = { version = "3", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[package.metadata.deb]
name = "typetune"
maintainer = "Kartamyshev <kartamyshev-dev@github.com>"
copyright = "2026 Kartamyshev"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Keyboard daemon with layout correction, anti-chatter and snippets. \
Provides automatic RU/EN layout switching, hardware key debounce \
for mechanical keyboards, and text snippet expansion."""
section = "utils"
priority = "optional"
depends = "libgtk-4-1 (>= 4.0), libadwaita-1-0 (>= 1.0), libevdev2, libudev1, libxkbcommon0, libdbus-1-2"
assets = [
    ["target/release/typetune", "usr/bin/", "755"],
    ["target/release/typetune-helper", "usr/bin/", "755"],
    ["target/release/typetune-gui", "usr/bin/", "755"],
    ["../../packaging/typetune.desktop", "usr/share/applications/", "644"],
    ["../../resources/icons/hicolor/scalable/status/typetune-active.svg", "usr/share/icons/hicolor/scalable/status/", "644"],
    ["../../resources/icons/hicolor/scalable/status/typetune-disabled.svg", "usr/share/icons/hicolor/scalable/status/", "644"],
    ["../../dict/ru.txt", "usr/share/typetune/dict/", "644"],
    ["../../dict/en.txt", "usr/share/typetune/dict/", "644"],
    ["../../config/default.toml", "etc/typetune/config.toml", "644"],
    ["../../packaging/typetune.service", "usr/lib/systemd/user/", "644"],
]
