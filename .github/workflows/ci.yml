name: CI and Debian preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONWARNINGS: ignore

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config dpkg-dev desktop-file-utils libevdev-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev libgtk-4-dev libadwaita-1-dev python3-gi gir1.2-gtk-4.0 gir1.2-ibus-1.0 gir1.2-atspi-2.0 dbus-x11 xvfb xauth
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
          cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Validate release version
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-version.py >> "$GITHUB_ENV"
      - name: Verify frequency data
        run: python3 scripts/verify-frequency-data.py
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked --offline -- -D warnings
      - name: Rust behavior tests and Python ABI
        run: |
          cargo test --workspace --all-targets --locked --offline
          cargo build -p typetune-ibus --locked --offline
      - name: Python behavior tests
        run: |
          /usr/bin/python3 -m unittest discover -s integrations/ibus -p 'test_*.py'
          /usr/bin/python3 -m unittest discover -s integrations/compat -p 'test_*.py'
          /usr/bin/python3 -m unittest discover -s tests/packaging -p 'test_*.py'
      - name: GTK controlled fixtures
        run: |
          for fixture in smoke words_smoke applications_smoke suggestions_smoke package_smoke; do
            xvfb-run -a dbus-run-session -- env GTK_A11Y=none /usr/bin/python3 "integrations/gui/$fixture.py"
          done
      - name: Build Debian package and verify lifecycle
        run: |
          python3 scripts/build-preview-deb.py --version "$DEB_VERSION"
          sudo /usr/bin/python3 tests/packaging/check_deb.py "dist/typetune-preview_${DEB_VERSION}_amd64.deb"
          (cd dist && sha256sum *.deb > SHA256SUMS)
          cp docs/releases/preview.md dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-preview
          path: dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$TAG" ./*.deb SHA256SUMS --verify-tag --prerelease --title "TypeTune $TAG — GNOME Linux preview" --notes-file RELEASE_NOTES.md
