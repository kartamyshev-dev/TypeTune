name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-core:
    name: Core and CLI (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    steps:
      - name: Install Python and Git
        run: apt-get update && apt-get install -y --no-install-recommends python3 git
      - uses: actions/checkout@v4
      - name: Trust the workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Offline checks
        run: scripts/ci_core.sh

  macos:
    name: App build and controller probe (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build every product
        run: swift build
      - name: Offline checks
        run: scripts/ci_core.sh
      - name: Recovery controller probe (test hooks, no permissions, no event tap)
        run: scripts/runtime_recovery_probe.sh
      - name: Test build for manual checks (release arm64, ad-hoc signature)
        run: |
          scripts/build.sh
          find dist/LayoutPilot.app -maxdepth 4 | sort
          dist/layoutpilot-cli selftest
          short=$(git rev-parse --short=7 HEAD)
          ditto dist/LayoutPilot.app "dist/TypeTune.app"
          (cd dist && ditto -c -k --keepParent TypeTune.app "TypeTune-$short.zip")
          shasum -a 256 dist/TypeTune.app/Contents/MacOS/LayoutPilot "dist/TypeTune-$short.zip" > dist/SHA256.txt
          git rev-parse HEAD > dist/COMMIT.txt
          cat dist/SHA256.txt dist/COMMIT.txt
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TypeTune-test-${{ github.sha }}
          path: |
            dist/TypeTune-*.zip
            dist/SHA256.txt
            dist/COMMIT.txt
            dist/build-identity.json
          retention-days: 30
